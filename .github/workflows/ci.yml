name: Aegis CI Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies & spaCy language model
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          python -m spacy download en_core_web_sm

      - name: Run Pytest test suite
        env:
          PYTHONPATH: backend
          HMAC_SECRET: test-hmac-secret-for-ci
          MASTER_VAULT_SECRET: test-master-vault-secret-for-ci
        run: |
          pytest backend/tests -v

  frontend-test-and-build:
    name: Frontend Vitest & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Run Vitest unit tests
        working-directory: frontend
        run: npm test

      - name: Verify Next.js production build
        working-directory: frontend
        env:
          AEGIS_BACKEND_URL: "http://127.0.0.1:8000"
          AEGIS_ADMIN_KEY: "demo-admin-key"
          AEGIS_VIEWER_KEY: "demo-viewer-key"
          ADMIN_PASSWORD: "admin"
          SESSION_SECRET: "test-session-secret-at-least-32-chars-long"
        run: npm run build
